version: "3"

services:
  invoiceslayer:
    container_name: invoiceslayer
    build: .
    image: cb37/invoiceslayer:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - AUTH_SECRET=${AUTH_SECRET:-your-generated-secret-min-32-chars-long}
      - AUTH_TRUST_HOST=true
      - NODE_ENV=production
      # Optional: Add these for cloud features
      # - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      # - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      # - AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}
      # - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}
      # - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      # - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      # - RESEND_API_KEY=${RESEND_API_KEY:-}
      # - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      # - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - invoiceslayer-data:/app/prisma
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/auth/session" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # For ZimaOS/CasaOS metadata (optional but helpful)
    x-casaos:
      envs:
        - container: DATABASE_URL
          description: "Database URL"
        - container: AUTH_SECRET
          description: "Auth Secret (generate with: openssl rand -base64 32)"
      ports:
        - container: "3000"
          description: "Web UI"
      volumes:
        - container: "/app/prisma"
          description: "SQLite Database Directory"
      architectures:
        - amd64
        - arm64

volumes:
  invoiceslayer-data:
    driver: local
