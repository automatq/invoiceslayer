services:
  invoiceslayer:
    container_name: invoiceslayer
    build: .
    image: cb37/invoiceslayer:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/dashboard
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/dashboard
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      # Optional: Add these for cloud features
      # - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      # - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      # - RESEND_API_KEY=${RESEND_API_KEY:-}
      # - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      # - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - invoiceslayer-data:/app/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # For ZimaOS/CasaOS metadata (optional but helpful)
    x-casaos:
      envs:
        - container: DATABASE_URL
          description: "Database URL"
        - container: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          description: "Clerk Publishable Key (from dashboard.clerk.com)"
        - container: CLERK_SECRET_KEY
          description: "Clerk Secret Key (from dashboard.clerk.com)"
      ports:
        - container: "3000"
          description: "Web UI"
      volumes:
        - container: "/app/data"
          description: "SQLite Database Directory"
      architectures:
        - amd64
        - arm64

volumes:
  invoiceslayer-data:
    driver: local
